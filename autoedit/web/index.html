<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>auto-edit</title>
<style>
:root{--bg:#0b0c10;--card:#12131a;--card2:#171823;--line:#262633;--text:#e8e8ee;--muted:#9a9aab;--accent:#aaa0ff;--accent2:#8575f6;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5c451}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
aside{border-right:1px solid var(--line);padding:18px 12px;background:#0d0e14;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#afa3ff,#8e7bf0)}.brand b{font-size:15px}
nav a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;padding:9px 10px;border-radius:9px;font-weight:500}nav a.on{color:var(--text);background:#1b1c26}nav a .n{width:20px;height:20px;border-radius:6px;background:#1b1c26;display:grid;place-items:center;font-size:11px;color:var(--accent)}nav a.on .n{background:var(--accent);color:#111}
.side-status{position:absolute;bottom:16px;left:12px;right:12px;font-size:12px;color:var(--muted)}.side-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--warn)}.side-status.ok .dot{background:var(--ok)}.side-status.bad .dot{background:var(--bad)}
main{padding:34px 40px;max-width:980px}h1{font-size:26px;margin:0 0 8px;letter-spacing:-.01em}.lead{color:var(--muted);font-size:15px;margin:0 0 24px}h2{font-size:13px;margin:26px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:10px 0}.card.soft{background:var(--card2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}small{color:var(--muted)}
button,.btn{background:#1b1c26;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button.primary,.btn.primary{background:var(--accent);color:#111;border-color:transparent;font-weight:650}button.danger{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.5;cursor:default}
pre,code{background:#0b0c10;border:1px solid var(--line);border-radius:8px;font:12.5px ui-monospace,Menlo,monospace}pre{padding:10px 12px;overflow:auto;white-space:pre-wrap;margin:8px 0}code{padding:1px 5px}
input[type=text],textarea{width:100%;background:#0b0c10;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit}textarea{min-height:72px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.check:first-of-type{border-top:0}.check .st{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;margin-top:1px;background:#1b1c26;color:var(--muted)}.check.ok .st{background:var(--ok);color:#06251a}.check.bad .st{background:#3a1a1a;color:var(--bad)}.check b{display:block}.check small{display:block;margin-top:2px}
.steps{counter-reset:s}.step{position:relative;padding:14px 0 14px 46px;border-top:1px solid var(--line)}.step:first-child{border-top:0}.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:14px;width:30px;height:30px;border-radius:50%;background:#1b1c26;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-weight:700}.step b{display:block;font-size:15px;margin-bottom:3px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#1b1c26;border:1px solid var(--line);color:var(--muted)}
video{width:100%;max-width:320px;border-radius:12px;background:#000}.shots img{height:220px;border-radius:8px;margin:4px;border:1px solid var(--line)}
.ok::before{content:"● ";color:var(--ok)}.bad::before{content:"● ";color:var(--bad)}.pending::before{content:"● ";color:var(--warn)}
#phoneimg{width:280px;border-radius:16px;border:1px solid var(--line);background:#000}
.promptbox{margin-top:8px;font:12px ui-monospace,Menlo,monospace;min-height:120px}
.note{font-size:12.5px;color:var(--muted)}
</style></head><body><div class="app">
<aside><div class="brand"><span class="mark"></span><b>auto-edit</b></div>
<nav id="nav"><a href="#start"><span class="n">1</span>Get started</a><a href="#make"><span class="n">2</span>Make a video</a><a href="#review"><span class="n">3</span>Review</a><a href="#queue"><span class="n">4</span>Posting queue</a><a href="#phone"><span class="n">•</span>Phone</a><a href="#connect"><span class="n">•</span>Connect</a></nav>
<div id="side" class="side-status"><span class="dot"></span><span id="sidetxt">checking…</span></div></aside>
<main id="main"></main></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j=async(u,o)=>(await fetch(u,o)).json();const post=(u,b)=>j(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});const fmt=t=>t?new Date(t*1000).toLocaleString():'';
let status={},info={};
async function load(){try{status=await j('/api/status');info=await j('/connect/info');}catch(e){}const s=$('#side');const ph=status.phone||{};s.className='side-status '+(status.ready_to_post?'ok':status.ok?'':'bad');$('#sidetxt').textContent=status.ready_to_post?'ready · phone connected':status.ok?'ready · phone not connected':'setup needed';route();}
function route(){const h=(location.hash||'#start').slice(1);if(h!=='review')$('#main').dataset.view=h;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));({start,make,review,queue,phone,connect}[h]||start)();}
function chk(ok,title,detail,action){return `<div class="check ${ok?'ok':'bad'}"><span class="st">${ok?'✓':'!'}</span><div class="grow"><b>${title}</b><small>${detail}</small></div>${action&&!ok?action:''}</div>`}
function start(){const s=status,ph=s.phone||{};const agent=!!s.agent_connected;
$('#main').innerHTML=`<h1>Reels, edited and posted by your AI.</h1><p class="lead">Put your takes in a folder, tell Claude what you want, review the cut, and it posts from your iPhone — captions and headers in real Instagram Edits text. Everything below happens once.</p>
<div class="card">
${chk(true,'This app','Editor, media tools and the local server are built in — nothing else to install.','')}
${chk(agent,'Connect Claude','Claude Desktop, Claude Code or ChatGPT talk to this app through one connection.', `<a class="btn primary" href="#connect">Connect</a>`)}
${chk(!!ph.ready,'Your iPhone', ph.ready?`Bridge connected · iOS ${esc(ph.ios||'')} · ${esc(ph.active_app||'')}`:'Latest iOS, Developer Mode on, plugged in by USB, Instagram Edits + Instagram logged in. Then let Claude finish the bridge setup.', `<a class="btn" href="#phone">Phone setup</a>`)}
</div>
<div class="card soft"><b>Let Claude do the setup.</b><p class="note" style="margin:6px 0 10px">After you connect, say this to Claude and it walks you through anything still red — including the iPhone bridge:</p><pre>Run setup_status and walk me through anything that isn't ready. Don't skip the iPhone bridge.</pre><div class="row"><button onclick="copyText('Run setup_status and walk me through anything that isn\\'t ready. Don\\'t skip the iPhone bridge.',this)">Copy</button><a class="btn primary" href="#make">Next: make a video →</a><button onclick="load()">Re-check</button></div></div>`;}
function make(){$('#main').innerHTML=`<h1>Make a video</h1><p class="lead">Four steps. The first video of a new format is a conversation; after that it's one sentence.</p>
<div class="card steps">
<div class="step"><b>Put your files in a folder</b><span class="note">Your raw takes (one take per sentence or section works best), the images you want on screen, the song, and a reference reel if you're copying a format.</span>
<div class="row" style="margin-top:10px"><input type="text" id="pname" placeholder="Project name, e.g. career-edition" style="max-width:320px"><button class="primary" onclick="newProject()">Create folder &amp; open in Finder</button><span id="pmsg" class="note"></span></div></div>
<div class="step"><b>Tell Claude exactly what you want</b><span class="note">Open Claude, paste this, then describe the edit in as much depth as you can: structure (hook → sections → call to action), what's on screen when, the music, the length, what must never happen.</span>
<textarea id="kick" class="promptbox" readonly></textarea><div class="row" style="margin-top:8px"><button class="primary" onclick="copyText($('#kick').value,this)">Copy the message</button><span class="note">Claude already knows the whole process — it's built into the connection.</span></div></div>
<div class="step"><b>Review the cut</b><span class="note">Claude cuts every pause, places your images, bakes the music, and puts the clean video in <a href="#review" style="color:var(--accent)">Review</a>. Watch it. Approve, or say precisely what to change — it fixes it and comes back.</span></div>
<div class="step"><b>Text, then post</b><span class="note">Once approved, Claude asks once how your headers/captions should look, runs the video through Instagram Edits on your phone (native fonts), parks the finished reel in Review for a last look, and shares it from Instagram — normal or trial reel, spaced however you asked. Sound is baked in during the edit; nothing is added in Edits.</span></div>
</div><div class="card soft"><b>Next time</b> <span class="note">— just say: <i>"New takes are in ~/Movies/auto-edit/&lt;project&gt;. Same format as last time, 3 videos, post them 30 minutes apart as trial reels."</i></span></div>`;
$('#kick').value=`I'm using auto-edit. My takes are in <FOLDER>. Start with setup_status. Here is the video I want: <describe the structure, what's on screen when, music, length, and anything that must never happen>. Ask me anything you need before you build, then hand me the clean cut in Review.`;}
async function newProject(){const n=($('#pname').value||'').trim();if(!n){$('#pmsg').textContent='give it a name';return}const r=await post('/api/project/new',{name:n});$('#pmsg').textContent=r.error?r.error:('created '+r.folder);if(!r.error){$('#kick').value=$('#kick').value.replace('<FOLDER>',r.folder);}}
let reviewSig='';
async function review(force){const items=await j('/api/review');const sig=JSON.stringify(items.map(i=>[i.id,i.status]));if(!force&&sig===reviewSig&&$('#main').dataset.view==='review')return;reviewSig=sig;$('#main').dataset.view='review';$('#main').innerHTML=`<h1>Review</h1><p class="lead">Finished videos wait here. Watch, then approve or send notes back — Claude is waiting on your decision.</p>`+(items.length?'':'<div class="card muted">Nothing to review yet. When Claude finishes a cut it appears here.</div>')+items.map(i=>`<div class="card"><div class="row"><span class="${i.status==='approved'?'ok':i.status==='pending'?'pending':'bad'}"><b>${esc(i.title)}</b></span><span class="tag">${i.status}</span><span class="muted">${fmt(i.created)}</span></div>
<div class="row" style="align-items:flex-start;margin-top:10px"><video controls preload="metadata" src="/file?path=${encodeURIComponent(i.video)}"></video><div class="grow"><pre>${esc(i.notes)}</pre>${i.images&&i.images.length?'<div class="shots">'+i.images.map(p=>`<img src="/file?path=${encodeURIComponent(p)}">`).join('')+'</div>':''}
${i.status==='pending'?`<textarea id="fb-${i.id}" placeholder="Feedback — what to change, as specific as you can"></textarea><div class="row" style="margin-top:8px"><button class="primary" onclick="decide('${i.id}','approved')">Approve</button><button onclick="decide('${i.id}','changes')">Request changes</button></div>`:`<div class="muted">${i.feedback?'Feedback: '+esc(i.feedback):''} ${fmt(i.decided)}</div>`}</div></div></div>`).join('');}
async function decide(id,st){const fb=($('#fb-'+id)||{}).value||'';await post('/api/review/'+id+'/decide',{status:st,feedback:fb});review();}
async function queue(){const q=await j('/api/queue');$('#main').innerHTML=`<h1>Posting queue</h1><p class="lead">Each job: Instagram Edits captions + headers → export → Instagram → (review) → share at its time. One at a time, ~35 min each.</p>`+(q.length?'':'<div class="card muted">No jobs yet.</div>')+q.slice().reverse().map(x=>`<div class="card"><div class="row"><span class="${x.status==='done'?'ok':['failed','cancelled','changes_requested'].includes(x.status)?'bad':'pending'}"><b>${esc(x.title)}</b></span><span class="tag">${x.status}${x.stage?' · '+x.stage:''}</span><span class="tag">${x.mode}</span>${x.not_before?`<span class="muted">not before ${fmt(x.not_before)}</span>`:''}${x.shared_at?`<span class="muted">shared ${fmt(x.shared_at)}</span>`:''}<span class="grow"></span>${['queued','waiting_review','waiting_time'].includes(x.status)?`<button class="danger" onclick="cancel('${x.id}')">Cancel</button>`:''}</div><pre>${esc((x.log||[]).slice(-6).join('\n'))}</pre></div>`).join('');}
async function cancel(id){await post('/api/queue/'+id+'/cancel');queue();}
function phone(){const s=status.phone||{};$('#main').innerHTML=`<h1>Phone</h1><p class="lead">Your iPhone is where the captions, headers and posting happen — in the real Instagram Edits and Instagram apps.</p><div class="row" style="align-items:flex-start"><img id="phoneimg" src="/phone/shot.jpg?${Date.now()}" onerror="this.style.opacity=.3"><div class="grow">
<div class="card">${s.ready?`<div class="ok">connected · iOS ${esc(s.ios||'')} · ${esc(s.active_app||'')}${s.busy?' · <span class=muted>'+esc(s.busy)+'</span>':''}</div>`:`<div class="bad">not connected</div>`}</div>
<div class="card steps"><div class="step"><b>On the phone</b><span class="note">Latest iOS. Settings → Privacy &amp; Security → <b>Developer Mode</b> → on → restart. Install <b>Instagram Edits</b> and <b>Instagram</b>, logged into the account you post from.</span></div>
<div class="step"><b>Plug it in</b><span class="note">USB, unlocked, tap <b>Trust This Computer</b>.</span></div>
<div class="step"><b>Let Claude install the bridge</b><span class="note">Say: <i>"Set up the iPhone bridge"</i>. It installs WebDriverAgent on the phone (needs Xcode once — Claude handles it) and confirms with <code>phone_status</code>. Live view appears here when it's up.</span></div></div>
<p class="note">Don't use the phone while a job is running.</p></div></div>`;
clearInterval(window._ph);window._ph=setInterval(()=>{if(location.hash!=='#phone')return clearInterval(window._ph);const im=$('#phoneimg');if(im)im.src='/phone/shot.jpg?'+Date.now();},3000);}
function connect(){$('#main').innerHTML=`<h1>Connect an agent</h1><p class="lead">One connection. Claude gets the whole process (rules, tools, order of work) the moment it connects.</p>
<div class="card"><div class="row"><div class="grow"><b>Claude Desktop</b><div class="note">Installs the auto-edit extension into Claude Desktop. Then just talk to Claude.</div></div><button class="primary" onclick="installClaude(this)">Add to Claude Desktop</button></div><div id="cdmsg" class="note" style="margin-top:8px"></div></div>
<div class="card"><b>Claude Code</b><div class="note">Run once in any terminal:</div><pre>${esc(info.claude_code||'')}</pre><button onclick="copyText(${JSON.stringify(info.claude_code||'')},this)">Copy</button></div>
<div class="card"><b>ChatGPT</b><div class="note">ChatGPT only reaches servers on the public internet, so expose this one through a tunnel while you work, then add the https URL + <code>/mcp</code> as a connector (Settings → Connectors → Advanced → Developer mode).</div><pre>brew install cloudflared\ncloudflared tunnel --url http://127.0.0.1:4747</pre></div>
<div class="card"><b>Cursor, Codex, anything else</b><pre>${esc(info.mcp_url||'')}</pre></div>`;}
async function installClaude(btn){btn.disabled=true;const r=await post('/connect/install-claude');$('#cdmsg').textContent=r.error?('Could not open the extension automatically: '+r.error+'. Download it from '+r.path+' and double-click it.'):'Opened in Claude Desktop — click Install there, then say hi to Claude.';btn.disabled=false;}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1500);}catch(e){prompt('Copy:',t)}}
window.addEventListener('hashchange',route);load();setInterval(()=>{const ta=[...document.querySelectorAll('textarea')];if(document.activeElement&&document.activeElement.tagName==='TEXTAREA')return;if(ta.some(t=>t.id&&t.id.startsWith('fb-')&&t.value.trim()))return;if([...document.querySelectorAll('video')].some(v=>!v.paused&&!v.ended))return;if(location.hash==='#review')review(false);else if(location.hash==='#queue')route();},8000);
</script></body></html>
